<template>
    <lightning-card title="Case Info" icon-name="standard:case">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Priority"
                onchange={getPriority}>
            </lightning-input>

            <lightning-input
                label="Origin"
                onchange={getOrigin}>
            </lightning-input>

            <lightning-input
                label="Status"
                onchange={getStatus}>
            </lightning-input>

            <lightning-input
                label="Subject"
                onchange={getSubject}>
            </lightning-input>

            <lightning-combobox
                label="Select Account"
                placeholder="Select Account"
                options={acList}
                value={accountId}
                onchange={getAccount}>
            </lightning-combobox>

            <br/>

            <lightning-button
                label="Save"
                variant="brand"
                onclick={saveCase}>
            </lightning-button>

        </div>

    </lightning-card>
</template>
