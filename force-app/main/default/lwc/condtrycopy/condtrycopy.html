<template>
    <lightning-card title="Calculator">

        <lightning-button
            label={btnMsg}
            variant="brand"
            onclick={toggleResult}
            slot="actions">
        </lightning-button>

        <div class="slds-p-around_medium">

            <lightning-input
                label="Enter Number 1"
                type="number"
                onchange={handleNum1}>
            </lightning-input>

            <lightning-input
                label="Enter Number 2"
                type="number"
                onchange={handleNum2}>
            </lightning-input>

            <br/>

            <lightning-button
                label="Add"
                variant="brand"
                onclick={add}>
            </lightning-button>

            <br/><br/>

            <template lwc:if={showResult}>
                <h2>{result}</h2>
            </template>

            <template lwc:else>
                <h3>Please click the Show Result button above.</h3>
            </template>

        </div>
    </lightning-card>
</template>
