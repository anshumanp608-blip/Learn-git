<template>
    <lightning-card title="Calculator">
        <div class="slds-p-around_medium">

            <lightning-input
                label="Enter Number 1"
                type="number"
                placeholder="Enter first number"
                value={num1}
                onchange={handleNum1}>
            </lightning-input>

            <lightning-input
                label="Enter Number 2"
                type="number"
                placeholder="Enter second number"
                value={num2}
                onchange={handleNum2}>
            </lightning-input>

            <br/>

            <lightning-button variant="destructive-text" label="Add"
             onclick={add} class="slds-m-left_x-small">
            </lightning-button>

            <lightning-button variant="success" label="Subtract"
             onclick={subtract} class="slds-m-left_x-small">
            </lightning-button>
    

            <lightning-button
                label="Multiply"
                variant="brand-outline"
                onclick={multiply}
                class="slds-m-left_x-small">
            </lightning-button>

            <lightning-button
                label="Divide"
                variant="destructive-text"
                onclick={divide}
                class="slds-m-left_x-small">
            </lightning-button>

            <br/><br/>

            <h1> {result}</h1>

        </div>
    </lightning-card>
</template>
