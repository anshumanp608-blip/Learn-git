<template>
    <lightning-card title="Library Books">
        <p style="margin-left: 20px;"><strong>Total Books:</strong> {size}</p>
        <template for:each={books} for:item="book">
            
            <div key={book.id} class="slds-box slds-m-around_small " style="background-color: antiquewhite;">
                
                <p><strong>ID:</strong> {book.id}</p>
                <p><strong>Book Name:</strong> {book.name}</p>
                <p><strong>Author:</strong> {book.author}</p>
                <hr>
                <p style="text-align: center;"><strong>Status:</strong> {book.status}</p>

            </div>


        </template>
        
    </lightning-card>
</template>
