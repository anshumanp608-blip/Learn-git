<template>
    <div class="slds-box" style="background-color: rgb(238, 197, 144);">
        <lightning-record-picker
            label="Contact"
            placeholder="Search Contact..."
            object-api-name="Contact"
            display-info={displayInfo}
            onchange={handleChange}>
        </lightning-record-picker>
       
    </div>
    <div class="slds-box" style="background-color: rgb(213, 238, 144);">
        Contact Detail : 
        <lightning-record-form object-api-name="Contact" 
        record-id={msg} layout-type="Compact" columns="2"></lightning-record-form>
       
    </div>
</template>
